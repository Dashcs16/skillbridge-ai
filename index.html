<section class="dashboard-grid">

    <div class="dashboard-card resume-card">

        <div class="card-icon">📄</div>

        <h2>Resume Intelligence</h2>

        <p>
            Upload your resume and automatically detect
            your technical skills.
        </p>

        <div class="upload-area">

            <input
                type="file"
                id="resume"
                accept=".pdf,.docx"
            >

            <label for="resume" class="upload-label">
                📤 Choose Resume
            </label>

            <p id="fileName">PDF or DOCX • Max 5 MB</p>

        </div>

        <button onclick="uploadResume()" class="secondary-btn">
            🔍 Analyze Resume
        </button>

        <div id="resumeResult"></div>

    </div>


    <div class="dashboard-card stats-card">

        <div class="card-icon">📊</div>

        <h2>Career Intelligence</h2>

        <div class="mini-stat">

            <span>🎯</span>

            <div>
                <strong>Skill Gap</strong>
                <small>Identify missing skills</small>
            </div>

        </div>

        <div class="mini-stat">

            <span>🗺️</span>

            <div>
                <strong>Personal Roadmap</strong>
                <small>Step-by-step learning path</small>
            </div>

        </div>

        <div class="mini-stat">

            <span>💼</span>

            <div>
                <strong>Career Readiness</strong>
                <small>Industry-focused analysis</small>
            </div>

        </div>

    </div>

</section>
